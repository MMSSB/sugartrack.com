<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - SugarTrack</title>
    
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v7.1.0/css/all.css"/>

    <style>
        /* --- CORE SETUP --- */
        body, html {
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            background-color: #09090b; /* Deep Dark Zinc */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        /* --- BACKGROUND ORBS (BLUR EFFECT) --- */
        .bg-shapes {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; 
            overflow: hidden;
        }
        .shape {
            position: absolute; 
            border-radius: 50%; 
            filter: blur(90px);
            opacity: 0.5; 
            animation: float 8s infinite alternate ease-in-out;
        }
        .shape-1 { 
            width: 400px; height: 400px; 
            background: #3b82f6; 
            top: -100px; left: -100px; 
        }
        .shape-2 { 
            width: 350px; height: 350px; 
            background: #10b981; 
            bottom: -100px; right: -50px; 
            animation-delay: -4s; 
        }
        .shape-3 { 
            width: 250px; height: 250px; 
            background: #8b5cf6; 
            top: 40%; left: 40%; 
            animation-delay: -2s; 
            opacity: 0.3;
        }

        /* --- GLASS PANEL --- */
        .glass-panel {
            position: relative; 
            z-index: 2;
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 4rem 3.5rem;
            text-align: center;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            min-height: 250px; /* Keeps the card size stable when switching elements */
            
            /* Entrance Animation */
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: entrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* --- LOGO --- */
        .logo-box {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 28px; font-weight: 800; letter-spacing: -1px;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 10px 30px -5px rgba(59, 130, 246, 0.6);
            
            opacity: 0; transform: scale(0.5);
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
        }

        /* --- TEXT --- */
        h1 { 
            color: #fafafa; 
            font-size: 2.2rem; 
            margin: 0 0 0.5rem 0; 
            font-weight: 700; 
            letter-spacing: -0.5px;
            opacity: 0; 
            animation: fadeUp 0.8s forwards 0.7s; 
        }
        p { 
            color: #a1a1aa; 
            font-size: 1.1rem; 
            margin: 0 0 2.5rem 0; 
            opacity: 0; 
            animation: fadeUp 0.8s forwards 0.9s; 
        }

        /* --- GET STARTED BUTTON --- */
        .btn-start {
            background: white;
            color: #09090b;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            opacity: 0; 
            animation: fadeUp 0.8s forwards 1.1s; 
        }

        .btn-start:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 35px -5px rgba(255, 255, 255, 0.3);
            background: #f4f4f5;
        }
        
        .btn-start:active {
            transform: translateY(0) scale(0.98);
        }

        /* --- ANIMATED PROGRESS BAR (Hidden by default) --- */
        .loader-wrapper {
            display: none; /* Hidden until button click */
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .loader-wrapper.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .loader-container {
            width: 100%; 
            max-width: 260px; 
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px; 
            margin: 0 auto;
            overflow: hidden; 
            position: relative;
        }
        
        .loader-bar {
            height: 100%; 
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 200% 100%;
            border-radius: 10px;
        }

        .loader-wrapper.active .loader-bar {
            animation: 
                progress 2s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                shimmer 2s linear infinite;
        }
        
        .loading-text {
            color: #3b82f6;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 1rem;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        /* --- KEYFRAMES --- */
        @keyframes float { 
            0% { transform: translate(0, 0) scale(1); } 
            100% { transform: translate(40px, 60px) scale(1.1); } 
        }
        @keyframes entrance { 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        @keyframes popIn { 
            to { opacity: 1; transform: scale(1); } 
        }
        @keyframes fadeUp { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes progress { 
            0% { width: 0%; } 
            100% { width: 100%; } 
        }
        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        /* --- EXIT ANIMATION CLASS --- */
        .fade-out {
            animation: exitScreen 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards !important;
        }
        @keyframes exitScreen {
            to { 
                opacity: 0; 
                transform: translateY(-40px) scale(1.05); 
                filter: blur(10px); 
            }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="glass-panel" id="welcomePanel">
        <div class="logo-box">ST</div>
        <h1>Welcome to SugarTrack</h1>
        <p id="statusText">Your personal diabetes assistant.</p>
        
        <div id="actionArea">
            <button class="btn-start" id="startBtn">
                Get Started <i class="fa-solid fa-arrow-right"></i>
            </button>
            
            <div class="loader-wrapper" id="loaderWrapper">
                <div class="loader-container">
                    <div class="loader-bar"></div>
                </div>
                <div class="loading-text">PREPARING Sugartrack...</div>
            </div>
        </div>
    </div>
<script>
        const startBtn = document.getElementById('startBtn');
        const loaderWrapper = document.getElementById('loaderWrapper');
        const statusText = document.getElementById('statusText');
        const welcomePanel = document.getElementById('welcomePanel');

        startBtn.addEventListener('click', () => {
            // 1. Animate button out
            startBtn.style.transition = "all 0.3s ease";
            startBtn.style.opacity = "0";
            startBtn.style.transform = "translateY(10px)";
            startBtn.style.pointerEvents = "none";
            
            // Change subtitle text
            statusText.style.opacity = "0";

            setTimeout(() => {
                // 2. Remove button, show loader, update text
                startBtn.style.display = "none";
                statusText.innerText = "Loading your data securely...";
                statusText.style.opacity = "1";
                
                loaderWrapper.classList.add('active');

                // 3. Wait for progress bar to finish (6 seconds), then animate out
                setTimeout(() => {
                    welcomePanel.classList.add('fade-out');
                    
                    // 4. Redirect after the fade-out animation finishes (500ms)
                    setTimeout(() => {
                        // FIX: Use replace() instead of href so it doesn't stay in browser history!
                        window.location.replace('tour.html');
                    }, 500);

                }, 6000); // Wait slightly longer than the progress animation

            }, 300); // Wait for button fade-out
        });
    </script>

</html>
