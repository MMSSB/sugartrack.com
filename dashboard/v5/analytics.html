<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - SugarTrack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v7.1.0/css/all.css"/>
    <link rel="stylesheet" href="Remix/fonts/remixicon.css">
    <script src="Photophor/src/index.js"></script>
        <script src="https://unpkg.com/@phosphor-icons/web"></script>    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="main.js"></script>
    <script src="script.js"></script>
</head>
<body>
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo" onclick="window.location.href='dashboard.html'">
                <div class="logo-box" style="">ST</div>
                <span class="logo-text">SugarTrack V5</span>
            </div>
            <button class="icon-btn mobile-close" id="mobileCloseBtn"><i class="ph ph-x"></i></button>
        </div>
<div class="sidebar-content">
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link "><i class="ph ph-squares-four"></i><span>Dashboard</span></a>
                <a href="readings.html" class="nav-link"><i class="ph ph-notebook"></i><span>Readings</span></a>
                <a href="search.html" class="nav-link"><i class="ri-search-ai-2-line"></i><span>Search Ai</span></a>
                <a href="inbox.html" class="nav-link"><i class="ph ph-tray"></i><span>Inbox</span></a>
                <a href="analytics.html" class="nav-link active"><i class="ph-fill ph-chart-line-up"></i><span>Analytics</span></a>
                <a href="export.html" class="nav-link"><i class="ph ph-file-pdf"></i><span>Reports</span></a>
                <a onclick="window.location.href='ai.html'" class="nav-link"><div class="robot-avatar" style="width: 25px; height: 25px; border-radius: 8px;"><div class="eye" style="width: 3px; height: 5px;"></div><div class="eye" style="width: 3px; height: 5px;"></div></div><span style="font-weight: 900; color: var(--text-primary);">Ask STAi</span></a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <div class="user-trigger" id="userMenuBtn">
                <div class="avatar"><img src="images/user.png" id="navProfilePhoto" class="navProfilePhoto" style=""></div>
                <div class="user-info">
                    <span class="u-name">User</span>
                    <span class="u-mail">user@mail.com</span>
                </div>
                <i class="ph ph-caret-up"></i>
            </div>
            
            <div class="dropdown-menu bottom-up" id="userDropdown">
                <a href="profile.html"><i class="ph ph-user"></i> Profile</a>
                <a href="settings.html"><i class="ph ph-gear"></i> Settings</a>
                <div class="divider"></div>
                <a href="#" onclick="logoutUser()" class="danger"><i class="ph ph-sign-out"></i> Log out</a>
            </div>
        </div>
    </aside>

    <main class="main-layout">
        <header class="top-header" style="border-bottom: 1px solid var(--border); box-shadow: none;">
            <div class="header-left">
                <button class="icon-btn mobile-toggle" id="mobileOpenBtn"><i class="ph ph-list"></i></button>
                <button class="icon-btn desktop-toggle" id="desktopCollapseBtn"><i class="ph ph-sidebar-simple"></i></button>
                <h2 class="page-title">Analytics & Insights</h2>
            </div>
        </header>

        <div class="content-scroll">
            <div class="container" style="max-width: 1200px;">
                
                <div class="stats-grid" style="margin-bottom: 2rem;">
                    <div class="card stat-card">
                        <div class="stat-top"><span>Time in Range (30d)</span><i class="ph ph-target" style="color: var(--success);"></i></div>
                        <div class="stat-val" id="tirValue">-- <span style="font-size: 1rem; font-weight:400; color: var(--text-secondary);">%</span></div>
                        <div class="stat-change neutral" id="tirSubtext">Target: > 70%</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-top"><span>Avg Fasting</span><i class="ph ph-sun" style="color: var(--warning);"></i></div>
                        <div class="stat-val" id="avgFasting">-- <span style="font-size: 1rem; font-weight:400; color: var(--text-secondary);">mg/dL</span></div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-top"><span>Avg Post-Meal</span><i class="ph ph-fork-knife" style="color: var(--info, #3b82f6);"></i></div>
                        <div class="stat-val" id="avgPostMeal">-- <span style="font-size: 1rem; font-weight:400; color: var(--text-secondary);">mg/dL</span></div>
                    </div>
                </div>

                <div class="charts-grid" style="grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem;">
                    
                    <div class="card chart-box" style="padding: 1.5rem;">
                        <h3 style="font-size: 1.05rem; font-weight: 600; margin-bottom: 1.5rem;">Glucose Distribution</h3>
                        <div style="position: relative; height: 280px; width: 100%;">
                            <canvas id="distributionChart"></canvas>
                        </div>
                    </div>

                    <div class="card chart-box" style="padding: 1.5rem;">
                        <h3 style="font-size: 1.05rem; font-weight: 600; margin-bottom: 1.5rem;">Averages by Context</h3>
                        <div style="position: relative; height: 280px; width: 100%;">
                            <canvas id="contextChart"></canvas>
                        </div>
                    </div>

                </div>
<br>
<br>
<br>
            </div>
        </div>
    </main>

    <script type="module" src="profile/pload.js"></script>
    <script type="module" src="analytics.js"></script>
    <script src="accent.js"></script>
</body>
</html>
